name: Test Auto Tag

on:
  push:
    - main
    - dev
      

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fetch_all_tags: true
          release_branches: main
          pre_release_branches: dev
          default_bump: patch

      - name: Show created tag
        run: |
          echo "New tag: ${{ steps.tag.outputs.new_tag }}"
          echo "New version: ${{ steps.tag.outputs.new_version }}"
          echo "Previous tag: ${{ steps.tag.outputs.previous_tag }}"
          echo "Release type: ${{ steps.tag.outputs.release_type }}"